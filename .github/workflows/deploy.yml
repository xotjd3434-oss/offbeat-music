name: Deploy Vite React to GitHub Pages

on:
  push:
    branches:
      - main

  # Actions 화면에서 수동 실행도 가능
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js 설치
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. npm 패키지 설치
      - name: Install dependencies
        run: npm ci

      # 4. Vite 프로젝트 빌드
      - name: Build
        run: npm run build

      # 5. GitHub Pages 설정
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 6. dist 폴더 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      # 7. GitHub Pages에 배포
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4